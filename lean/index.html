<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lean Meter" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css" media="all" />
<title>Motorcycle Lean Meter</title>
</head>
<body>
  <div id="app">
    <!-- ===== Dashboard ===== -->
    <div id="dashboard">
        <div class="left">
            <div class="stat" id="stat-speed" role="button" title="Tap to change units">
                <div class="label">SPEED</div>
                <div class="value"><span id="speed-value" class="number">--</span><span id="speed-unit">km/h</span></div>
            </div>
            <div class="stat secondary" id="stat-duration">
                <div class="label">DURATION</div>
                <div class="value number" id="duration-value">--</div>
            </div>
            <div class="stat secondary" id="stat-distance">
                <div class="label">DISTANCE</div>
                <div class="value"><span id="distance-value" class="number">--</span><span id="distance-unit">km</span></div>
            </div>
        </div>
        <div class="center">
            <div class="current">
                <h1>Lean angle</h1>
                <div id="angle" class="number degree">0&deg;</div>
            </div>

            <div class="gauge">
                <div class="gauge-track">
                    <div class="gauge-center"></div>
                    <div id="gauge-indicator"></div>
                </div>
                <div class="gauge-labels"><span>LEFT</span><span>RIGHT</span></div>
            </div>

            <div class="stats">
                <div class="stat" id="stat-left">
                    <div class="label">MAX LEFT</div>
                    <div class="value number degree">0</div>
                </div>
                <div class="stat spacer"></div>
                <div class="stat" id="stat-right">
                    <div class="label">MAX RIGHT</div>
                    <div class="value number degree">0</div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="controls">
            <button id="btn-zero" type="button">Zero</button>
            <button id="btn-reset" type="button">Reset</button>
            <button id="btn-awake" type="button" class="on">Stay Awake: On</button>
            </div>
        </div>
    </div>

    <!-- ===== Start screen ===== -->
    <div id="start-screen">
      <h1>Motorcycle Lean Meter</h1>
      <div class="tap">Tap To Start</div>
      <p id="start-note"></p>
    </div>

    <!-- ===== Portrait warning ===== -->
    <div id="rotate-warning">
      <div class="rotate-phone"></div>
      <h2>Rotate Phone</h2>
      <p>Landscape Mode Required</p>
    </div>
  </div>

<script src="lean.js"></script>
</body>
</html>
