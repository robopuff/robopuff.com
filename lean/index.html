<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lean Meter" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Motorcycle Lean Meter</title>
  <script type="module" crossorigin src="./assets/index-CWDmXojA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C9zv_20b.css">
</head>
<body>
  <div id="app">
    <!-- ===== Dashboard ===== -->
    <div id="dashboard">
        <div class="left">
            <div class="stat" id="stat-speed" role="button" title="Tap to change units">
                <div class="label">SPEED</div>
                <div class="value"><span id="speed-value" class="number">--</span><span id="speed-unit">km/h</span></div>
            </div>
            <div class="stat secondary" id="stat-duration">
                <div class="label">DURATION</div>
                <div class="value number" id="duration-value">--</div>
            </div>
            <div class="stat secondary" id="stat-distance">
                <div class="label">DISTANCE</div>
                <div class="value"><span id="distance-value" class="number">--</span><span id="distance-unit">km</span></div>
            </div>
        </div>
        <div class="center">
            <div class="current">
                <h1>Lean angle</h1>
                <div id="angle" class="number degree">0&deg;</div>
            </div>

            <div class="gauge">
                <div class="gauge-track">
                    <div class="gauge-center"></div>
                    <div id="gauge-indicator"></div>
                </div>
                <div class="gauge-labels"><span>LEFT</span><span>RIGHT</span></div>
            </div>

            <div class="stats">
                <div class="stat" id="stat-left">
                    <div class="label">MAX LEFT</div>
                    <div class="value number degree">0</div>
                </div>
                <div class="stat spacer"></div>
                <div class="stat" id="stat-right">
                    <div class="label">MAX RIGHT</div>
                    <div class="value number degree">0</div>
                </div>
            </div>
        </div>
        <div class="right">
            <div id="ride-state" class="ride-state" role="button" title="Tap for the full ride summary">
                <div class="ride-state-label">RIDE</div>
                <div id="ride-state-word" class="ride-state-word number band-calibrating">CALIBRATING</div>
            </div>
            <div class="controls">
            <button id="btn-zero" type="button">Zero</button>
            <button id="btn-reset" type="button">Reset</button>
            <button id="btn-awake" type="button" class="on">Stay Awake: On</button>
            </div>
        </div>
    </div>

    <!-- ===== Start screen ===== -->
    <div id="start-screen">
      <h1>Motorcycle Lean Meter</h1>
      <div class="tap">Tap To Start</div>
      <p id="start-note"></p>
    </div>

    <!-- ===== Portrait warning ===== -->
    <div id="rotate-warning">
      <div class="rotate-phone"></div>
      <h2>Rotate Phone</h2>
      <p>Landscape Mode Required</p>
    </div>

    <!-- ===== Ride summary ===== -->
    <div id="summary" class="hidden">
      <div class="summary-card">
        <h2>Ride Summary</h2>
        <div class="summary-hero">
          <div id="summary-score" class="summary-score number">--</div>
          <div id="summary-band" class="summary-band">NOT ENOUGH DATA</div>
        </div>
        <p id="summary-note" class="summary-note"></p>
        <div id="summary-metrics" class="summary-metrics">
          <div class="metric" data-metric="calmness">
            <div class="metric-head">
              <span class="metric-label">Calmness</span>
              <span class="metric-value number">--</span>
            </div>
            <div class="metric-bar"><span></span></div>
          </div>
          <div class="metric" data-metric="consistency">
            <div class="metric-head">
              <span class="metric-label">Consistency</span>
              <span class="metric-value number">--</span>
            </div>
            <div class="metric-bar"><span></span></div>
          </div>
          <div class="metric" data-metric="stability">
            <div class="metric-head">
              <span class="metric-label">Stability</span>
              <span class="metric-value number">--</span>
            </div>
            <div class="metric-bar"><span></span></div>
          </div>
          <div class="metric" data-metric="balance">
            <div class="metric-head">
              <span class="metric-label">Balance</span>
              <span class="metric-value number">--</span>
            </div>
            <div class="metric-bar"><span></span></div>
          </div>
        </div>
        <div class="summary-footer">
          <span id="summary-meta" class="summary-meta"></span>
          <div class="summary-actions">
            <button id="btn-export" type="button">Export</button>
            <button id="btn-close-summary" type="button">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
